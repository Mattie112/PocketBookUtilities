name: Release

# Publish a release on GitHub (Releases, "Draft a new release", create a tag
# like v0.0.3 or v0.0.3-alpha, Publish). That is the whole process: this
# workflow stamps the plugin with the version from the tag, builds the zip
# and attaches it to the release.
#
# PLUGIN_VERSION in __init__.py is the development default. A release is
# stamped from its tag, so the tag is what decides the published version and
# there is nothing to edit beforehand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.0.3-alpha'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp the version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python build.py --is-prerelease "$TAG")" \
            >> "$GITHUB_OUTPUT"
          python build.py --set-version "$TAG"
          python build.py --version

      - name: Run the tests that need no calibre
        run: python tests/run_tests.py

      - name: Build the plugin zip
        run: python build.py

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: PocketBook Utilities.zip
          fail_on_unmatched_files: true
