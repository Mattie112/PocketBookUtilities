name: Release

# Publish a release on GitHub (Releases, "Draft a new release", create a tag
# like v0.0.3 or v0.0.3-alpha, Publish). That is the whole process: this
# workflow stamps the plugin with the version from the tag, builds the zip
# and attaches it to the release.
#
# PLUGIN_VERSION in __init__.py is the development default. A release is
# stamped from its tag, so the tag is what decides the published version and
# there is nothing to edit beforehand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.0.3-alpha'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the plugin zip
    runs-on: ubuntu-latest
    steps:
      # Build the tagged commit, not whatever the default branch holds by
      # now: a manual run for an older tag would otherwise attach newer,
      # unreleased code to that release under the old version number.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Stamp the version from the tag
        id: version
        # The tag reaches the script through the environment, never pasted
        # into it, so nothing in a tag name can run as shell.
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          # Fails here on anything that is not vX.Y.Z[-suffix], before the
          # value is written anywhere.
          PRERELEASE="$(python build.py --is-prerelease "$TAG")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          python build.py --set-version "$TAG"
          python build.py --version

      - name: Run the tests that need no calibre
        run: python tests/run_tests.py

      - name: Build the plugin zip
        run: python build.py

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: PocketBook Utilities.zip
          fail_on_unmatched_files: true
